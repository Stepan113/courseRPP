<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">CourseRPP</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/cash-withdrawals">Cash Withdrawals</a>
            <a class="nav-link text-white" href="/money-transfers">Money Transfers</a>
            <a class="nav-link text-white" href="/reports">Reports</a>
            <span class="navbar-text me-3 text-white ms-3" sec:authentication="name"></span>
            <a class="nav-link text-white" th:href="@{/auth/logout}">Logout</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Bank Accounts (Счета)</h2>
        <a href="/scores/new" class="btn btn-success">+ New Account</a>
    </div>
    <table class="table table-striped table-hover">
        <thead class="table-primary">
        <tr>
            <th>Account Number</th>
            <th>Balance</th>
            <th>Currency</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="score : ${scores}">
            <td th:text="${score.number}"></td>
            <td th:text="${score.balance}"></td>
            <td th:text="${score.currency}"></td>
            <td>
                <a th:href="@{/scores/{id}/edit(id=${score.id})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/scores/{id}/delete(id=${score.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(scores)}">
            <td colspan="4" class="text-center text-muted">No accounts found</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
