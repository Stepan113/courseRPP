<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Счета</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        a { margin-right: 5px; }
    </style>
</head>
<body>
<h1>Счета</h1>
<a th:href="@{/}">Главная</a> | <a th:href="@{/scores/new}">Добавить</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Номер</th>
        <th>Баланс</th>
        <th>Валюта</th>
        <th>Пользователь</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="score : ${scores}">
        <td th:text="${score.id}"></td>
        <td th:text="${score.number}"></td>
        <td th:text="${score.balance}"></td>
        <td th:text="${score.currency}"></td>
        <td th:text="${score.userLogin}"></td>
        <td>
            <a th:href="@{/scores/{id}(id=${score.id})}">Просмотр</a>
            <a th:href="@{/scores/{id}/edit(id=${score.id})}">Редактировать</a>
            <form th:action="@{/scores/{id}/delete(id=${score.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
