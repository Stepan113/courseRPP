<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Счёт</title>
    <style>body { font-family: Arial, sans-serif; margin: 20px; }</style>
</head>
<body>
<h1>Счёт</h1>
<a th:href="@{/scores}">Назад</a>
<p><b>ID:</b> <span th:text="${score.id}"></span></p>
<p><b>Номер:</b> <span th:text="${score.number}"></span></p>
<p><b>Баланс:</b> <span th:text="${score.balance}"></span></p>
<p><b>Валюта:</b> <span th:text="${score.currency}"></span></p>
<p><b>Пользователь:</b> <span th:text="${score.userLogin}"></span></p>
<a th:href="@{/scores/{id}/edit(id=${score.id})}">Редактировать</a>
<form th:action="@{/scores/{id}/delete(id=${score.id})}" method="post" style="display:inline">
    <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
</form>
</body>
</html>
