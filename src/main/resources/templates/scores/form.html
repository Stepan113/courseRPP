<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/scores">← Back to Accounts</a>
    </div>
</nav>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 th:text="${score.id != null} ? 'Edit Account' : 'New Account'">Account Form</h5>
                </div>
                <div class="card-body">
                    <form th:action="${score.id != null} ? @{/scores/{id}/edit(id=${score.id})} : @{/scores/new}"
                          th:object="${score}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Account Number</label>
                            <input type="text" th:field="*{number}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Balance</label>
                            <input type="text" th:field="*{balance}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Currency</label>
                            <input type="number" th:field="*{currency}" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="/scores" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
