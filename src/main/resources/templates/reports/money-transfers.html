<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчёт: Денежные переводы</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>
<h1>Отчёт: Денежные переводы</h1>
<a th:href="@{/reports}">Назад к отчётам</a>
<p>Всего записей: <b th:text="${moneyTransfers.size()}"></b></p>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Сумма</th>
        <th>Дата создания</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mt : ${moneyTransfers}">
        <td th:text="${mt.id}"></td>
        <td th:text="${mt.sum}"></td>
        <td th:text="${mt.createdAt}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
