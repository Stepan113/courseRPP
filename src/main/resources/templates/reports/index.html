<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/scores">← Accounts</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/auth/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h2>Reports (Отчеты)</h2>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card shadow mb-4">
        <div class="card-header bg-primary text-white">Generate Report</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">From Date</label>
                    <input type="date" id="from" name="from" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">To Date</label>
                    <input type="date" id="to" name="to" class="form-control">
                </div>
            </div>
            <div class="mt-3">
                <a id="textReportBtn" href="#" class="btn btn-outline-primary me-2" onclick="openReport('text')">Download Text Report</a>
                <a id="excelReportBtn" href="#" class="btn btn-outline-success me-2" onclick="openReport('excel')">Download Excel Report</a>
            </div>
        </div>
    </div>
    <div class="card shadow">
        <div class="card-header bg-secondary text-white">Send Report by Email</div>
        <div class="card-body">
            <form method="post" th:action="@{/reports/email}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">From Date</label>
                        <input type="date" name="from" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">To Date</label>
                        <input type="date" name="to" class="form-control" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-secondary w-100">Send</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
function openReport(type) {
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;
    if (!from || !to) { alert('Please select dates'); return; }
    window.location.href = '/reports/' + type + '?from=' + from + '&to=' + to;
}
</script>
</body>
</html>
