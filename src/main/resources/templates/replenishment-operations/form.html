<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Операция пополнения</title>
    <style>body { font-family: Arial, sans-serif; margin: 20px; } label { display: block; margin-top: 10px; }</style>
</head>
<body>
<h1 th:text="${id} ? 'Редактировать операцию' : 'Новая операция пополнения'">Операция</h1>
<a th:href="@{/replenishment-operations}">Назад</a>
<form th:action="${id} ? @{/replenishment-operations/{id}(id=${id})} : @{/replenishment-operations}" method="post" th:object="${replenishmentOperation}">
    <label>Сумма: <input type="number" th:field="*{sum}"/></label>
    <br/><button type="submit">Сохранить</button>
</form>
</body>
</html>
