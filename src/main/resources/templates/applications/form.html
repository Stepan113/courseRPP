<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/applications">← Back</a>
    </div>
</nav>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h5>Application for Cash Form</h5>
                </div>
                <div class="card-body">
                    <form th:action="${application.id != null} ? @{/applications/{id}/edit(id=${application.id})} : @{/applications/new}"
                          th:object="${application}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Withdrawal Amount</label>
                            <input type="number" th:field="*{withdrawalAmount}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Delay (days)</label>
                            <input type="number" th:field="*{delay}" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-success">Save</button>
                        <a href="/applications" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
