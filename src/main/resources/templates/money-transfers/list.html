<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Money Transfers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/scores">← Accounts</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/auth/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Money Transfers (Переводы)</h2>
        <a href="/money-transfers/new" class="btn btn-success">+ New</a>
    </div>
    <table class="table table-striped">
        <thead class="table-primary">
        <tr>
            <th>Sum</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="mt : ${moneyTransfers}">
            <td th:text="${mt.sum}"></td>
            <td th:text="${mt.createdAt}"></td>
            <td>
                <a th:href="@{/money-transfers/{id}/edit(id=${mt.id})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/money-transfers/{id}/delete(id=${mt.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(moneyTransfers)}">
            <td colspan="3" class="text-center text-muted">No money transfers found</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
