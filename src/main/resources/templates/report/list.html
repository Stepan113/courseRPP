<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчеты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div class="container mt-4">
    <h2 class="mb-3">Отчеты</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card mb-4">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Скачать отчет по заявкам на выдачу наличных</h5>
        </div>
        <div class="card-body">
            <p class="text-muted">Отчет содержит все заявки на выдачу наличных по вашим картам.</p>
            <div class="d-flex gap-2">
                <a href="/reports/excel" class="btn btn-success">
                    <i class="bi bi-file-earmark-excel"></i> Скачать Excel
                </a>
                <a href="/reports/word" class="btn btn-primary">
                    <i class="bi bi-file-earmark-word"></i> Скачать Word
                </a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Отправить PDF-отчет по счету на email</h5>
        </div>
        <div class="card-body">
            <form method="post" action="/reports/email">
                <div class="mb-3">
                    <label class="form-label">Выберите счет</label>
                    <select name="scoreId" class="form-select" required>
                        <option value="">-- Выберите счет --</option>
                        <option th:each="score : ${scores}"
                                th:value="${score.id}"
                                th:text="${score.number} + ' (баланс: ' + ${score.balance} + ')'">
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email адрес</label>
                    <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
                </div>
                <button type="submit" class="btn btn-secondary">Отправить PDF-отчет</button>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
