<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Card Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="min-width:200px;min-height:100vh;">
        <h5 class="text-white">Menu</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/users}">Users</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/cards}">Cards</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/scores}">Scores</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/applications}">Applications</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/withdrawals}">Withdrawals</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/transfers}">Transfers</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/replenishments}">Replenishments</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/reports}">Reports</a></li>
        </ul>
    </nav>
    <main class="p-4 flex-grow-1">
        <h2 th:text="${id} ? 'Edit Card' : 'Create Card'"></h2>
        <form th:action="${id} ? @{/cards/{id}(id=${id})} : @{/cards}" method="post">
            <div class="mb-3">
                <label class="form-label">Number</label>
                <input type="text" class="form-control" name="number" th:value="${card.number}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Balance</label>
                <input type="number" class="form-control" name="balance" th:value="${card.balance}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">CVC</label>
                <input type="text" class="form-control" name="cvc" th:value="${card.cvc}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">User</label>
                <select class="form-select" name="userId">
                    <option th:each="user : ${users}"
                            th:value="${user.id}"
                            th:text="${user.login}"
                            th:selected="${card.userId != null and card.userId == user.id}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/cards}" class="btn btn-secondary">Cancel</a>
        </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
