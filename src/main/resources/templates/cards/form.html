<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Card Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/cards">← Back to Cards</a>
    </div>
</nav>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h5 th:text="${card.id != null} ? 'Edit Card' : 'New Card'">Card Form</h5>
                </div>
                <div class="card-body">
                    <form th:action="${card.id != null} ? @{/cards/{id}/edit(id=${card.id})} : @{/cards/new}"
                          th:object="${card}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Card Number</label>
                            <input type="text" th:field="*{number}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Balance</label>
                            <input type="number" th:field="*{balance}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CVC</label>
                            <input type="text" th:field="*{CVC}" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-success">Save</button>
                        <a href="/cards" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
