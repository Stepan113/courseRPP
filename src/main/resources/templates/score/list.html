<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счета</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div class="container mt-4">
    <h2 class="mb-3">Мои счета</h2>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-primary">
                <tr>
                    <th>Номер счета</th>
                    <th>Баланс</th>
                    <th>Валюта</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="score : ${scores}">
                    <td th:text="${score.number}"></td>
                    <td th:text="${score.balance}"></td>
                    <td th:text="${score.currency}"></td>
                    <td>
                        <a th:href="@{/scores/{id}(id=${score.id})}" class="btn btn-sm btn-primary">Подробнее</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(scores)}">
                    <td colspan="4" class="text-center text-muted py-3">Счета не найдены</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
