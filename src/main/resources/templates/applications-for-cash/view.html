<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявка на наличные</title>
    <style>body { font-family: Arial, sans-serif; margin: 20px; }</style>
</head>
<body>
<h1>Заявка на наличные</h1>
<a th:href="@{/applications-for-cash}">Назад</a>
<p><b>ID:</b> <span th:text="${application.id}"></span></p>
<p><b>Задержка (дни):</b> <span th:text="${application.delay}"></span></p>
<p><b>Сумма снятия:</b> <span th:text="${application.withdrawalAmount}"></span></p>
<a th:href="@{/applications-for-cash/{id}/edit(id=${application.id})}">Редактировать</a>
<form th:action="@{/applications-for-cash/{id}/delete(id=${application.id})}" method="post" style="display:inline">
    <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
</form>
</body>
</html>
