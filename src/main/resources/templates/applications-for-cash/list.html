<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявки на наличные</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        a { margin-right: 5px; }
    </style>
</head>
<body>
<h1>Заявки на наличные</h1>
<a th:href="@{/}">Главная</a> | <a th:href="@{/applications-for-cash/new}">Добавить</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Задержка (дни)</th>
        <th>Сумма снятия</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="application : ${applications}">
        <td th:text="${application.id}"></td>
        <td th:text="${application.delay}"></td>
        <td th:text="${application.withdrawalAmount}"></td>
        <td>
            <a th:href="@{/applications-for-cash/{id}(id=${application.id})}">Просмотр</a>
            <a th:href="@{/applications-for-cash/{id}/edit(id=${application.id})}">Редактировать</a>
            <form th:action="@{/applications-for-cash/{id}/delete(id=${application.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
