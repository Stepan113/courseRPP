<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Replenishment Operations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="min-width:200px;min-height:100vh;">
        <h5 class="text-white">Menu</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/users}">Users</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/cards}">Cards</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/scores}">Scores</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/applications}">Applications</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/withdrawals}">Withdrawals</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/transfers}">Transfers</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/replenishments}">Replenishments</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/reports}">Reports</a></li>
        </ul>
    </nav>
    <main class="p-4 flex-grow-1">
        <h2>Replenishment Operations</h2>
        <a th:href="@{/replenishments/new}" class="btn btn-primary mb-3">Create New</a>
        <table class="table table-bordered">
            <thead>
                <tr><th>ID</th><th>Sum</th><th>Created At</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="item : ${replenishments}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.sum}"></td>
                    <td th:text="${item.createdAt != null} ? ${#dates.format(item.createdAt, 'yyyy-MM-dd HH:mm')} : ''"></td>
                    <td>
                        <a th:href="@{/replenishments/{id}/edit(id=${item.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <form th:action="@{/replenishments/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Delete?')">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
