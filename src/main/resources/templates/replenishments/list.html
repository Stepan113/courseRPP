<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Replenishments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/cards">← Cards</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/auth/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Replenishment Operations (Пополнения)</h2>
        <a href="/replenishments/new" class="btn btn-success">+ New</a>
    </div>
    <table class="table table-striped">
        <thead class="table-success">
        <tr>
            <th>Sum</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rep : ${replenishments}">
            <td th:text="${rep.sum}"></td>
            <td th:text="${rep.createdAt}"></td>
            <td>
                <a th:href="@{/replenishments/{id}/edit(id=${rep.id})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/replenishments/{id}/delete(id=${rep.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(replenishments)}">
            <td colspan="3" class="text-center text-muted">No replenishments found</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
