<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div class="container mt-4">
    <h2 class="mb-3">Добро пожаловать, <span th:text="${userLogin}">user</span>!</h2>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Мои карты</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0">
                        <thead>
                        <tr>
                            <th>Номер карты</th>
                            <th>Баланс</th>
                            <th>CVC</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="card : ${cards}">
                            <td th:text="${card.number}"></td>
                            <td th:text="${card.balance}"></td>
                            <td th:text="${card.CVC}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(cards)}">
                            <td colspan="3" class="text-center text-muted">Нет карт</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Мои счета</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0">
                        <thead>
                        <tr>
                            <th>Номер счета</th>
                            <th>Баланс</th>
                            <th>Валюта</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="score : ${scores}">
                            <td th:text="${score.number}"></td>
                            <td th:text="${score.balance}"></td>
                            <td th:text="${score.currency}"></td>
                            <td><a th:href="@{/scores/{id}(id=${score.id})}" class="btn btn-sm btn-outline-primary">Детали</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(scores)}">
                            <td colspan="4" class="text-center text-muted">Нет счетов</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <a href="/reports" class="btn btn-outline-secondary">Перейти к отчетам</a>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
