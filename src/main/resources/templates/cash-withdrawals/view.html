<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Снятие наличных</title>
    <style>body { font-family: Arial, sans-serif; margin: 20px; }</style>
</head>
<body>
<h1>Снятие наличных</h1>
<a th:href="@{/cash-withdrawals}">Назад</a>
<p><b>ID:</b> <span th:text="${cashWithdrawal.id}"></span></p>
<p><b>Сумма снятия:</b> <span th:text="${cashWithdrawal.withdrawalAmount}"></span></p>
<p><b>Дата создания:</b> <span th:text="${cashWithdrawal.createdAt}"></span></p>
<a th:href="@{/cash-withdrawals/{id}/edit(id=${cashWithdrawal.id})}">Редактировать</a>
<form th:action="@{/cash-withdrawals/{id}/delete(id=${cashWithdrawal.id})}" method="post" style="display:inline">
    <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
</form>
</body>
</html>
