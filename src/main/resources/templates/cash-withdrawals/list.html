<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Снятия наличных</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        a { margin-right: 5px; }
    </style>
</head>
<body>
<h1>Снятия наличных</h1>
<a th:href="@{/}">Главная</a> | <a th:href="@{/cash-withdrawals/new}">Добавить</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Сумма снятия</th>
        <th>Дата создания</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cw : ${cashWithdrawals}">
        <td th:text="${cw.id}"></td>
        <td th:text="${cw.withdrawalAmount}"></td>
        <td th:text="${cw.createdAt}"></td>
        <td>
            <a th:href="@{/cash-withdrawals/{id}(id=${cw.id})}">Просмотр</a>
            <a th:href="@{/cash-withdrawals/{id}/edit(id=${cw.id})}">Редактировать</a>
            <form th:action="@{/cash-withdrawals/{id}/delete(id=${cw.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
