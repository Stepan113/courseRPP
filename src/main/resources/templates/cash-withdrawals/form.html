<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Снятие наличных</title>
    <style>body { font-family: Arial, sans-serif; margin: 20px; } label { display: block; margin-top: 10px; }</style>
</head>
<body>
<h1 th:text="${id} ? 'Редактировать снятие' : 'Новое снятие наличных'">Снятие</h1>
<a th:href="@{/cash-withdrawals}">Назад</a>
<form th:action="${id} ? @{/cash-withdrawals/{id}(id=${id})} : @{/cash-withdrawals}" method="post" th:object="${cashWithdrawal}">
    <label>Сумма снятия: <input type="number" th:field="*{withdrawalAmount}"/></label>
    <br/><button type="submit">Сохранить</button>
</form>
</body>
</html>
