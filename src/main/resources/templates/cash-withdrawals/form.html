<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cash Withdrawal Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/cash-withdrawals">← Back</a>
    </div>
</nav>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5>Cash Withdrawal Form</h5>
                </div>
                <div class="card-body">
                    <form th:action="${cashWithdrawal.id != null} ? @{/cash-withdrawals/{id}/edit(id=${cashWithdrawal.id})} : @{/cash-withdrawals/new}"
                          th:object="${cashWithdrawal}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" th:field="*{withdrawalAmount}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Link to Account</label>
                            <select name="scoreId" class="form-select">
                                <option value="">-- None --</option>
                                <option th:each="score : ${scores}" th:value="${score.id}" th:text="${score.number}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Link to Application</label>
                            <select name="applicationId" class="form-select">
                                <option value="">-- None --</option>
                                <option th:each="app : ${applications}" th:value="${app.id}"
                                        th:text="${'App #' + app.id + ' (' + app.withdrawalAmount + ')'}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="/cash-withdrawals" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
